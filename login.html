<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador - Los Mayorga TV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background-color: #030712;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    #futuristic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      padding: 35px 30px;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
      text-align: center;
    }

    .brand-title {
      color: #38bdf8;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .brand-subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      fill: #64748b;
      transition: fill 0.3s ease;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 42px 12px 38px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    input:focus + .input-icon {
      fill: #38bdf8;
    }

    /* BOTÓN TOGGLE DE VER/OCULTAR CONTRASEÑA CON VECTORIAL ANIMADO */
    .toggle-password-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .toggle-password-btn:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .eye-icon {
      width: 20px;
      height: 20px;
      fill: #94a3b8;
      transition: transform 0.2s ease, fill 0.2s ease;
    }

    .toggle-password-btn:hover .eye-icon {
      fill: #38bdf8;
      transform: scale(1.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-login:hover {
      background: #0369a1;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .error-msg {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid #dc2626;
      color: #fca5a5;
      font-size: 12px;
      padding: 10px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="futuristic-bg"></canvas>

  <div class="login-card">
    <div class="brand-title">
      <svg style="width:24px; height:24px; fill:#38bdf8;" viewBox="0 0 24 24">
        <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
      </svg>
      LOS MAYORGA TV
    </div>
    <p class="brand-subtitle">Ingresa la clave de administración</p>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Contraseña de Acceso</label>
        <div class="input-wrapper">
          <!-- ÍCONO CANDADO -->
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>

          <input type="password" id="password-input" placeholder="••••••••" required>

          <!-- BOTÓN VER/OCULTAR CON CAMBIO VECTORIAL DINÁMICO -->
          <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Mostrar u ocultar clave">
            <!-- SVG OJO TACHADO (OCULTO POR DEFECTO) -->
            <svg id="icon-eye-off" class="eye-icon" viewBox="0 0 24 24">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>
            </svg>

            <!-- SVG OJO COMPLETO (VISIBLE CUANDO SE MOSTRARÁ) -->
            <svg id="icon-eye-on" class="eye-icon hidden" viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">
        Ingresar al Panel
        <svg style="width:16px; height:16px; fill:#fff;" viewBox="0 0 24 24">
          <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/>
        </svg>
      </button>
    </form>

    <div id="error-msg" class="error-msg">Contraseña incorrecta. Inténtalo nuevamente.</div>
  </div>

  <script>
    // ALTERNAR VISIBILIDAD DE CONTRASEÑA Y CAMBIO VECTORIAL
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById("password-input");
      const iconEyeOff = document.getElementById("icon-eye-off");
      const iconEyeOn = document.getElementById("icon-eye-on");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        iconEyeOff.classList.add("hidden");
        iconEyeOn.classList.remove("hidden");
      } else {
        passwordInput.type = "password";
        iconEyeOn.classList.add("hidden");
        iconEyeOff.classList.remove("hidden");
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const inputPass = document.getElementById("password-input").value;
      const errorDiv = document.getElementById("error-msg");

      // Clave de acceso configurada
      if (inputPass === "Mayorga2026") {
        sessionStorage.setItem("internal_auth_mayorga", "true");
        window.location.href = "admin.html";
      } else {
        errorDiv.style.display = "block";
        document.getElementById("password-input").value = "";
      }
    }

    // CANVAS FONDO DE PARTÍCULAS FUTURISTAS
    const canvas = document.getElementById('futuristic-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.radius = Math.random() * 2 + 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
