<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Panel - Los Mayorga TV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: #030712;
      color: #f8fafc;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* CANVAS DE FONDO DINÁMICO FUTURISTA */
    #futuristic-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* TARJETA DE LOGIN */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(2, 132, 199, 0.25), inset 0 0 15px rgba(56, 189, 248, 0.1);
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      fill: #38bdf8;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 8px rgba(56,189,248,0.5));
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    .login-header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      fill: #0284c7;
      z-index: 2;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 40px 12px 40px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .toggle-icon {
      width: 18px;
      height: 18px;
      fill: #64748b;
      transition: fill 0.2s;
    }

    .toggle-password:hover .toggle-icon {
      fill: #38bdf8;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
      transform: translateY(-1px);
    }

    .error-msg { color: #f87171; font-size: 12px; text-align: center; margin-top: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <!-- CANVAS DE FONDO DINÁMICO FUTURISTA -->
  <canvas id="futuristic-bg"></canvas>

  <div class="login-card">
    <div class="login-header">
      <!-- ÍCONO VECTORIAL TV -->
      <svg class="brand-icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      <h1>Los Mayorga TV</h1>
      <p>Gestor de Pantallas Digitales</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      
      <!-- USUARIO -->
      <div class="form-group">
        <label>Usuario</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input type="text" id="user-input" placeholder="Ingrese su usuario" required>
        </div>
      </div>

      <!-- CONTRASEÑA -->
      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" id="password-input" placeholder="Ingrese su contraseña" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password-input')" title="Mostrar/Ocultar clave">
            <svg class="toggle-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <!-- PALABRA CLAVE -->
      <div class="form-group">
        <label>Palabra Clave</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v2h2v-2h2v-2h-8.35zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
          <input type="password" id="keyword-input" placeholder="Ingrese palabra clave" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('keyword-input')" title="Mostrar/Ocultar palabra clave">
            <svg class="toggle-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">Ingresar al Sistema</button>
      <div id="error-message" class="error-msg hidden">Usuario, contraseña o palabra clave incorrectos.</div>
    </form>
  </div>

  <script>
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = (field.type === "password") ? "text" : "password";
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("user-input").value.trim();
      const pass = document.getElementById("password-input").value.trim();
      const key = document.getElementById("keyword-input").value.trim();

      // Credenciales: mayorga / mayorga123 / tv2026
      if (user === "mayorga" && pass === "mayorga123" && key === "tv2026") {
        sessionStorage.setItem("internal_auth_mayorga", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById("error-message").classList.remove("hidden");
      }
    }

    // ANIMACIÓN CANVAS PARTÍCULAS
    const canvas = document.getElementById('futuristic-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const particleCount = 60;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1;
        this.vy = (Math.random() - 0.5) * 1;
        this.radius = Math.random() * 2 + 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#0284c7';
        ctx.fill();
      }
    }

    for (let i = 0; i < particleCount; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(56, 189, 248, ${1 - dist / 120})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
