<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidriera Digital - Los Mayorga TV</title>

  <!-- Tipografías web livianas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">

  <!-- SDK Firebase v9 (Compatibilizado y ultra liviano) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100vw; 
      height: 100vh; 
      background-color: #000; 
      overflow: hidden; 
      cursor: none; 
      font-family: 'Oswald', sans-serif;
      /* Optimización de renderizado de texto para TVs */
      text-rendering: optimizeSpeed;
      -webkit-font-smoothing: antialiased;
    }

    #slider-container { position: relative; width: 100vw; height: 100vh; }
    
    .slide { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      opacity: 0;
      visibility: hidden;
      /* Transición nativa por hardware, liviana para el chip de la TV */
      transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
      will-change: opacity;
    }

    .slide.active { 
      opacity: 1; 
      visibility: visible;
      z-index: 10; 
    }

    .bg-image { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      z-index: 1; 
    }

    .overlay-content { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 55%; 
      height: 100%; 
      z-index: 2; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      padding-left: 4vw; 
      color: #fff; 
      text-transform: uppercase; 
    }

    .title-main { 
      font-size: 8.5vw; 
      font-weight: 700; 
      color: #38bdf8; 
      line-height: 0.85; 
      text-shadow: 2px 2px 10px rgba(0,0,0,0.9); 
    }

    .subtitle { 
      font-size: 2.2vw; 
      color: #fff; 
      margin-top: 8px; 
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9); 
    }

    .details-row { 
      display: flex; 
      align-items: baseline; 
      gap: 1.5vw; 
      margin-top: 12px; 
    }

    .volume { 
      font-size: 8vw; 
      font-weight: 700; 
      color: #fef08a; 
      line-height: 0.8; 
      text-shadow: 2px 2px 10px rgba(0,0,0,0.9); 
    }

    .pack-info { 
      font-size: 3vw; 
      font-weight: 700; 
      color: #fff; 
      line-height: 0.95; 
      max-width: 14vw; 
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9); 
    }

    .price-override { 
      position: absolute; 
      bottom: 4vh; 
      right: 4vw; 
      z-index: 3; 
      background-color: #fff; 
      padding: 0.5vw 2vw; 
      font-family: 'Roboto Condensed', sans-serif; 
      color: #000; 
      font-size: 5.5vw; 
      font-weight: 900; 
      display: flex; 
      align-items: flex-start; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.6); 
      border-radius: 4px; 
    }

    .price-override .cents { 
      font-size: 2.8vw; 
      text-decoration: underline; 
      margin-left: 3px; 
    }
  </style>
</head>
<body>

  <div id="slider-container"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAhTFpjaWhAUnA3P5_pXGNgjAUlKEtDXAA",
      authDomain: "losmayorgatv.firebaseapp.com",
      projectId: "losmayorgatv",
      storageBucket: "losmayorgatv.appspot.com",
      messagingSenderId: "859965884915",
      appId: "1:859965884915:web:0610001dc222438ae7ea86",
      measurementId: "G-3Y1B4PKTF6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DURACION_SLIDE_MS = 7000;
    const container = document.getElementById("slider-container");
    
    let productos = [];
    let currentIndex = 0;
    let timer = null;

    // Escuchar cambios en Firestore
    db.collection("productos").onSnapshot(snapshot => {
      const now = new Date();
      const rawData = [];
      
      snapshot.forEach(doc => rawData.push({ id: doc.id, ...doc.data() }));

      // Ordenar en memoria local
      rawData.sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));

      const filtered = rawData.filter(p => {
        const isActivo = p.activo !== false;
        const isDateValid = !p.fechaProgramada || new Date(p.fechaProgramada) <= now;
        return isActivo && isDateValid;
      });

      if (filtered.length > 0 && JSON.stringify(filtered) !== JSON.stringify(productos)) {
        productos = filtered;
        buildCarousel();
      }
    });

    // Función de optimización URL de Cloudinary para Smart TV
    function getOptimizedImageUrl(url) {
      if (!url) return '';
      if (url.includes('cloudinary.com')) {
        // Forza resolución HD (1280px max), calidad auto y formato auto ultra-liviano (WebP/JPG)
        return url.replace('/upload/', '/upload/w_1280,c_limit,f_auto,q_auto:eco/');
      }
      return url;
    }

    function buildCarousel() {
      clearTimeout(timer);
      container.innerHTML = "";

      productos.forEach((prod, index) => {
        const slide = document.createElement("div");
        slide.className = `slide ${index === 0 ? 'active' : ''}`;

        const imgUrl = getOptimizedImageUrl(prod.imagenUrl);

        slide.innerHTML = `
          <img src="${imgUrl}" class="bg-image" loading="${index === 0 ? 'eager' : 'lazy'}">
          <div class="overlay-content">
            <div class="title-main">${prod.titulo}</div>
            <div class="subtitle">${prod.subtitulo || ''}</div>
            <div class="details-row">
              <div class="volume">${prod.volumen || ''}</div>
              <div class="pack-info">${prod.presentacion || ''}</div>
            </div>
          </div>
          <div class="price-override">
            $ ${prod.precioEntero}<span class="cents">${prod.precioDecimal || '00'}</span>
          </div>
        `;
        container.appendChild(slide);
      });

      currentIndex = 0;
      preloadNextImage();
      startTimer();
    }

    function preloadNextImage() {
      if (productos.length <= 1) return;
      const nextIndex = (currentIndex + 1) % productos.length;
      const nextImgUrl = getOptimizedImageUrl(productos[nextIndex].imagenUrl);
      const img = new Image();
      img.src = nextImgUrl;
    }

    function nextSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length <= 1) return;

      slides[currentIndex].classList.remove("active");
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add("active");

      preloadNextImage();
      startTimer();
    }

    function startTimer() {
      clearTimeout(timer);
      if (productos.length > 1) {
        timer = setTimeout(nextSlide, DURACION_SLIDE_MS);
      }
    }

    // Prevención de cuelgues: Recarga limpia del navegador cada 12 horas para liberar RAM de la TV
    setTimeout(() => {
      window.location.reload();
    }, 12 * 60 * 60 * 1000);
  </script>
</body>
</html>
