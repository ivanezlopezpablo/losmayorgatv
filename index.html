<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Interno - Los Mayorga TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h2 { margin-bottom: 20px; text-align: center; color: #38bdf8; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 11px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .error-msg { background: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Acceso Interno Mayorista</h2>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="user" required placeholder="admin" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="pass" required placeholder="••••••••" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Palabra Secreta del Local</label>
        <input type="password" id="secret" required placeholder="Palabra clave" autocomplete="off">
      </div>
      <button type="submit">Ingresar al Control</button>
    </form>
    <div id="error" class="error-msg">Datos de acceso incorrectos. Revisa usuario, clave o palabra secreta.</div>
  </div>

  <script>
    // CREDENCIALES CONFIGURADAS
    const CREDENTIALS = {
      user: "admin",
      pass: "mayorga123",
      secret: "cerveza2026"
    };

    // Si ya existe sesión iniciada en el navegador
    if (sessionStorage.getItem("internal_auth_mayorga") === "true") {
      window.location.href = "admin.html";
    }

    function handleLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById("user").value.trim().toLowerCase();
      const passVal = document.getElementById("pass").value.trim();
      const secretVal = document.getElementById("secret").value.trim().toLowerCase();

      if (userVal === CREDENTIALS.user && passVal === CREDENTIALS.pass && secretVal === CREDENTIALS.secret) {
        sessionStorage.setItem("internal_auth_mayorga", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }
  </script>
</body>
</html>
