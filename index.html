<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidriera Digital - Los Mayorga TV</title>

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; background-color: #000; overflow: hidden; cursor: none; font-family: 'Oswald', sans-serif; }
    #slider-container { position: relative; width: 100vw; height: 100vh; }
    .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .slide.active { display: block; z-index: 10; }
    .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    
    /* BADGE OFERTA 3D EN SMART TV (REUBICADO MÁS ABAJO) */
    .badge-oferta-3d {
      position: absolute;
      top: 14vh; /* Bajado para no tapar los bordes superiores */
      left: 10vw;
      z-index: 10;
      background: linear-gradient(180deg, #ffe600 0%, #ff8800 50%, #d90000 100%);
      color: #fff;
      font-weight: 900;
      font-size: 3.5vw;
      padding: 0.2vw 1.2vw;
      border-radius: 0.6vw;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 0.3vw solid #fff;
      box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 3px 3px rgba(255,255,255,0.7);
      text-shadow: 3px 3px 0px #700000;
      display: flex;
      align-items: center;
      gap: 0.8vw;
      transform: rotate(-3deg);
    }

    .fire-icon {
      display: inline-block;
      animation: flameAnim 0.8s infinite alternate ease-in-out;
    }

    @keyframes flameAnim {
      0% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 4px #ff3300); }
      100% { transform: scale(1.3) rotate(5deg); filter: drop-shadow(0 0 12px #ffff00); }
    }

    .overlay-content { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 55%; 
      height: 100%; 
      z-index: 2; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      padding-left: 10vw; 
      color: #fff; 
      text-transform: uppercase; 
    }
    
    .title-main { 
      font-size: 8.5vw; 
      font-weight: 700; 
      line-height: 0.85; 
      text-shadow: 
        0.3vw 0.3vw 0 #000, -0.3vw -0.3vw 0 #000, 0.3vw -0.3vw 0 #000, -0.3vw 0.3vw 0 #000,
        0 0.5vw 2vw rgba(0,0,0,0.9); 
    }
    
    /* SUBTÍTULO Y PRESENTACIÓN: BLANCO PURO CON BORDE COMPUESTO */
    .subtitle { 
      font-size: 2.3vw; 
      font-weight: 700;
      color: #ffffff; 
      margin-top: 8px; 
      text-shadow: 
        0.2vw 0.2vw 0 #000, -0.2vw -0.2vw 0 #000, 0.2vw -0.2vw 0 #000, -0.2vw 0.2vw 0 #000,
        0 0 1.5vw rgba(0,0,0,0.95); 
    }
    
    .details-row { 
      display: flex; 
      align-items: baseline; 
      gap: 1.5vw; 
      margin-top: 10px; 
    }
    
    .volume { 
      font-size: 8vw; 
      font-weight: 700; 
      line-height: 0.8; 
      text-shadow: 
        0.3vw 0.3vw 0 #000, -0.3vw -0.3vw 0 #000, 0.3vw -0.3vw 0 #000, -0.3vw 0.3vw 0 #000,
        0 0.5vw 2vw rgba(0,0,0,0.9); 
    }
    
    .pack-info { 
      font-size: 3vw; 
      font-weight: 700; 
      color: #ffffff; 
      line-height: 0.95; 
      max-width: 15vw; 
      text-shadow: 
        0.2vw 0.2vw 0 #000, -0.2vw -0.2vw 0 #000, 0.2vw -0.2vw 0 #000, -0.2vw 0.2vw 0 #000,
        0 0 1.5vw rgba(0,0,0,0.95); 
    }
    
    .price-override { 
      position: absolute; 
      bottom: 18vh; 
      right: 4vw; 
      z-index: 3; 
      background-color: #fff; 
      padding: 0.5vw 2vw; 
      font-family: 'Roboto Condensed', sans-serif; 
      color: #000; 
      font-size: 5.5vw; 
      font-weight: 900; 
      display: flex; 
      align-items: flex-start; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
      border-radius: 4px; 
    }
    
    .price-override .cents { 
      font-size: 2.8vw; 
      text-decoration: underline; 
      margin-left: 3px; 
    }
  </style>
</head>
<body>

  <div id="slider-container"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAhTFpjaWhAUnA3P5_pXGNgjAUlKEtDXAA",
      authDomain: "losmayorgatv.firebaseapp.com",
      projectId: "losmayorgatv",
      storageBucket: "losmayorgatv.appspot.com",
      messagingSenderId: "859965884915",
      appId: "1:859965884915:web:0610001dc222438ae7ea86",
      measurementId: "G-3Y1B4PKTF6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DURACION_SLIDE_MS = 7000;
    const TRANSICIONES = [
      { in: "animate__fadeInRight", out: "animate__fadeOutLeft" },
      { in: "animate__zoomIn", out: "animate__zoomOut" },
      { in: "animate__flipInX", out: "animate__flipOutX" },
      { in: "animate__slideInUp", out: "animate__slideOutDown" }
    ];

    const container = document.getElementById("slider-container");
    let productos = [];
    let currentIndex = 0;
    let stepTimeout = null;
    let transitionIndex = 0;

    // ESCUCHA EN TIEMPO REAL (AUTO-RECURSIVO PARA REFLEJO INMEDIATO EN SMART TV)
    db.collection("productos").onSnapshot(snapshot => {
      const now = new Date();
      const rawData = [];
      snapshot.forEach(doc => rawData.push({ id: doc.id, ...doc.data() }));

      rawData.sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));

      const filtered = rawData.filter(p => {
        const isActivo = p.activo !== false;
        const isDateValid = !p.fechaProgramada || new Date(p.fechaProgramada) <= now;
        return isActivo && isDateValid;
      });

      // Actualizar automáticamente sin necesidad de recargar la página del navegador
      productos = filtered;
      updateDOMSlides();
    });

    function updateDOMSlides() {
      clearTimeout(stepTimeout);
      container.innerHTML = "";

      if (productos.length === 0) return;

      productos.forEach((prod, index) => {
        const slide = document.createElement("div");
        slide.classList.add("slide", "animate__animated");
        if (index === 0) slide.classList.add("active");

        const colorTitle = prod.colorTitulo || "#38bdf8";
        const colorVol = prod.colorVolumen || "#fef08a";

        const bgMedia = prod.tipoMedia === "video" 
          ? `<video src="${prod.imagenUrl}" class="bg-image" autoplay loop muted playsinline crossorigin="anonymous"></video>`
          : `<img src="${prod.imagenUrl}" class="bg-image" crossorigin="anonymous">`;

        const badgeOfertaHTML = prod.showOfertaBadge === true
          ? `<div class="badge-oferta-3d animate__animated animate__jackInTheBox animate__delay-1s">
               <span>¡OFERTA!</span><span class="fire-icon">🔥</span>
             </div>`
          : '';

        slide.innerHTML = `
          ${badgeOfertaHTML}
          ${bgMedia}
          <div class="overlay-content">
            <div class="title-main animate__animated animate__bounceInLeft animate__delay-1s" style="color: ${colorTitle}">${prod.titulo}</div>
            <div class="subtitle animate__animated animate__fadeInLeft animate__delay-1s">${prod.subtitulo || ''}</div>
            <div class="details-row">
              <div class="volume animate__animated animate__fadeInUp animate__delay-1s" style="color: ${colorVol}">${prod.volumen || ''}</div>
              <div class="pack-info animate__animated animate__fadeInUp animate__delay-1s">${prod.presentacion || ''}</div>
            </div>
          </div>
          <div class="price-override animate__animated animate__pulse animate__infinite">
            $ ${prod.precioEntero}<span class="cents">${prod.precioDecimal || '00'}</span>
          </div>
        `;
        container.appendChild(slide);
      });

      currentIndex = 0;
      playCurrentSlide();
    }

    function playCurrentSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length <= 1) return;

      stepTimeout = setTimeout(() => {
        nextSlide();
      }, DURACION_SLIDE_MS);
    }

    function nextSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length <= 1) return;

      const currentSlide = slides[currentIndex];
      const effect = TRANSICIONES[transitionIndex];

      currentSlide.className = `slide active animate__animated ${effect.out}`;

      currentIndex = (currentIndex + 1) % slides.length;
      transitionIndex = (transitionIndex + 1) % TRANSICIONES.length;

      const nextSlide = slides[currentIndex];

      setTimeout(() => {
        currentSlide.classList.remove("active", "animate__animated", effect.out);
        nextSlide.className = `slide active animate__animated ${effect.in}`;
        playCurrentSlide();
      }, 800);
    }
  </script>
</body>
</html>
