<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vidriera Digital - Los Mayorga TV</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; background-color: #000; overflow: hidden; cursor: none; font-family: 'Oswald', sans-serif; }
    #slider-container { position: relative; width: 100vw; height: 100vh; }
    .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .slide.active { display: block; z-index: 10; }
    .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    .overlay-content { position: absolute; top: 0; left: 0; width: 50%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: center; padding-left: 4vw; color: #fff; text-transform: uppercase; }
    .title-main { font-size: 8.5vw; font-weight: 700; color: #38bdf8; line-height: 0.85; text-shadow: 3px 3px 15px rgba(0,0,0,0.8); }
    .subtitle { font-size: 2.2vw; color: #fff; margin-top: 5px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
    .details-row { display: flex; align-items: baseline; gap: 1.5vw; margin-top: 10px; }
    .volume { font-size: 8vw; font-weight: 700; color: #fef08a; line-height: 0.8; text-shadow: 3px 3px 12px rgba(0,0,0,0.8); }
    .pack-info { font-size: 3vw; font-weight: 700; color: #fff; line-height: 0.95; max-width: 12vw; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
    .price-override { position: absolute; bottom: 4vh; right: 4vw; z-index: 3; background-color: #fff; padding: 0.5vw 2vw; font-family: 'Roboto Condensed', sans-serif; color: #000; font-size: 5.5vw; font-weight: 900; display: flex; align-items: flex-start; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-radius: 4px; }
    .price-override .cents { font-size: 2.8vw; text-decoration: underline; margin-left: 3px; }
  </style>
</head>
<body>

  <div id="slider-container"></div>

  <script>
    const GITHUB_USER = "ivanezlopezpablo"; 
    const GITHUB_REPO = "losmayorgatv"; 
    const DURACION_SLIDE_MS = 7000;
    const REFRESCAR_REPOS_MS = 3 * 60 * 1000;

    const TRANSICIONES = [
      { in: "animate__fadeInRight", out: "animate__fadeOutLeft" },
      { in: "animate__zoomIn", out: "animate__zoomOut" },
      { in: "animate__flipInX", out: "animate__flipOutX" },
      { in: "animate__slideInUp", out: "animate__slideOutDown" }
    ];

    const container = document.getElementById("slider-container");
    let productos = [];
    let currentIndex = 0;
    let stepTimeout = null;
    let transitionIndex = 0;

    async function fetchProductsFromGitHub() {
      const jsonUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/productos.json?t=${new Date().getTime()}`;
      
      try {
        const response = await fetch(jsonUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const rawData = await response.json();
        const now = new Date();

        // FILTRADO INTELIGENTE: Solo tomar activos y cuya fecha programada ya haya llegado
        const filteredData = rawData.filter(p => {
          const isActivo = p.activo !== false;
          const isDateValid = !p.fechaProgramada || new Date(p.fechaProgramada) <= now;
          return isActivo && isDateValid;
        });

        if (filteredData.length > 0 && JSON.stringify(filteredData) !== JSON.stringify(productos)) {
          productos = filteredData;
          updateDOMSlides();
        }
      } catch (error) {
        console.warn("Error cargando productos.json:", error);
      }
    }

    function updateDOMSlides() {
      clearTimeout(stepTimeout);
      container.innerHTML = "";
      
      productos.forEach((prod, index) => {
        const slide = document.createElement("div");
        slide.classList.add("slide", "animate__animated");
        if (index === 0) slide.classList.add("active");

        const imgUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/imagenes/${prod.imagen}`;

        slide.innerHTML = `
          <img src="${imgUrl}" class="bg-image" alt="${prod.titulo}">
          
          <div class="overlay-content">
            <div class="title-main animate__animated animate__bounceInLeft animate__delay-1s">${prod.titulo}</div>
            <div class="subtitle animate__animated animate__fadeInLeft animate__delay-1s">${prod.subtitulo || ''}</div>
            <div class="details-row">
              <div class="volume animate__animated animate__fadeInUp animate__delay-1s">${prod.volumen || ''}</div>
              <div class="pack-info animate__animated animate__fadeInUp animate__delay-1s">${prod.presentacion || ''}</div>
            </div>
          </div>

          <div class="price-override animate__animated animate__pulse animate__infinite">
            $ ${prod.precioEntero}<span class="cents">${prod.precioDecimal || '00'}</span>
          </div>
        `;

        container.appendChild(slide);
      });

      currentIndex = 0;
      playCurrentSlide();
    }

    function playCurrentSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length === 0) return;

      stepTimeout = setTimeout(() => {
        nextSlide();
      }, DURACION_SLIDE_MS);
    }

    function nextSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length <= 1) return;

      const currentSlide = slides[currentIndex];
      const effect = TRANSICIONES[transitionIndex];

      currentSlide.className = `slide active animate__animated ${effect.out}`;

      currentIndex = (currentIndex + 1) % slides.length;
      transitionIndex = (transitionIndex + 1) % TRANSICIONES.length;

      const nextSlide = slides[currentIndex];

      setTimeout(() => {
        currentSlide.classList.remove("active", "animate__animated", effect.out);
        nextSlide.className = `slide active animate__animated ${effect.in}`;
        playCurrentSlide();
      }, 800);
    }

    fetchProductsFromGitHub();
    setInterval(fetchProductsFromGitHub, REFRESCAR_REPOS_MS);
  </script>
</body>
</html>
