<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Carga - Los Mayorga TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 20px; text-align: center; color: #38bdf8; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0369a1; }
    .hidden { display: none; }
    #status { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; text-align: center; }
    .success { background: #15803d; color: #fff; }
    .error { background: #b91c1c; color: #fff; }
  </style>
</head>
<body>

  <div id="token-card" class="card">
    <h2>Acceso Administrador</h2>
    <div class="form-group">
      <label>GitHub Personal Access Token</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
    </div>
    <button onclick="saveToken()">Ingresar al Panel</button>
  </div>

  <div id="admin-card" class="card hidden">
    <h2>Cargar Producto a Vidriera</h2>
    <form id="product-form">
      <div class="form-group">
        <label>Imagen Limpia del Producto</label>
        <input type="file" id="prod-img" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>Título (ej. CERVEZA)</label>
        <input type="text" id="prod-title" required placeholder="CERVEZA">
      </div>
      <div class="form-group">
        <label>Subtítulo (ej. CLÁSICA EN LATA)</label>
        <input type="text" id="prod-sub" placeholder="CLÁSICA EN LATA">
      </div>
      <div class="form-group">
        <label>Volumen / Medida (ej. 473CC)</label>
        <input type="text" id="prod-vol" placeholder="473CC">
      </div>
      <div class="form-group">
        <label>Presentación (ej. PACK POR 6 UNIDADES)</label>
        <input type="text" id="prod-pack" placeholder="PACK POR 6 UNIDADES">
      </div>
      <div class="form-group">
        <label>Precio Entero (ej. 21.076)</label>
        <input type="text" id="prod-price-int" required placeholder="21.076">
      </div>
      <div class="form-group">
        <label>Precio Decimales (ej. 90)</label>
        <input type="text" id="prod-price-dec" value="00">
      </div>
      <button type="button" onclick="uploadToGitHub()">Publicar en TV</button>
      <button type="button" onclick="logout()" style="background:#475569;">Cerrar Sesión</button>
    </form>
    <div id="status" class="hidden"></div>
  </div>

  <script>
    const GITHUB_USER = "ivanezlopezpablo";
    const GITHUB_REPO = "losmayorgatv";

    let token = localStorage.getItem("gh_token") || "";

    if (token) {
      document.getElementById("token-card").classList.add("hidden");
      document.getElementById("admin-card").classList.remove("hidden");
    }

    function saveToken() {
      const inputToken = document.getElementById("gh-token").value.trim();
      if (!inputToken) return alert("Ingresa un Token válido");
      localStorage.setItem("gh_token", inputToken);
      token = inputToken;
      document.getElementById("token-card").classList.add("hidden");
      document.getElementById("admin-card").classList.remove("hidden");
    }

    function logout() {
      localStorage.removeItem("gh_token");
      location.reload();
    }

    function showStatus(msg, isError = false) {
      const statusDiv = document.getElementById("status");
      statusDiv.textContent = msg;
      statusDiv.className = isError ? "error" : "success";
      statusDiv.classList.remove("hidden");
    }

    // Convertir archivo a Base64
    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    async function uploadToGitHub() {
      const fileInput = document.getElementById("prod-img");
      if (!fileInput.files[0]) return alert("Selecciona una imagen");

      showStatus("Subiendo imagen y actualizando datos a GitHub...");

      try {
        const file = fileInput.files[0];
        const base64Content = await toBase64(file);
        const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

        // 1. Subir la imagen a la carpeta /imagenes en GitHub mediante API
        const imgApiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/imagenes/${fileName}`;
        const imgResponse = await fetch(imgApiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Añadir imagen ${fileName}`,
            content: base64Content
          })
        });

        if (!imgResponse.ok) throw new Error("Error al subir la imagen a GitHub");

        // 2. Obtener el archivo productos.json actual
        const jsonApiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/productos.json`;
        const jsonGetResp = await fetch(jsonApiUrl, {
          headers: { "Authorization": `token ${token}` }
        });

        let currentProducts = [];
        let sha = "";

        if (jsonGetResp.ok) {
          const jsonFileData = await jsonGetResp.json();
          sha = jsonFileData.sha;
          const decodedContent = decodeURIComponent(escape(atob(jsonFileData.content)));
          currentProducts = JSON.parse(decodedContent);
        }

        // 3. Crear el nuevo objeto de producto y agregarlo a la lista
        const newProduct = {
          imagen: fileName,
          titulo: document.getElementById("prod-title").value.toUpperCase(),
          subtitulo: document.getElementById("prod-sub").value.toUpperCase(),
          volumen: document.getElementById("prod-vol").value.toUpperCase(),
          presentacion: document.getElementById("prod-pack").value.toUpperCase(),
          precioEntero: document.getElementById("prod-price-int").value,
          precioDecimal: document.getElementById("prod-price-dec").value
        };

        currentProducts.push(newProduct);

        // 4. Guardar el productos.json actualizado en GitHub
        const updatedJsonBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentProducts, null, 2))));
        
        const jsonPutResp = await fetch(jsonApiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Actualizar productos.json con ${newProduct.titulo}`,
            content: updatedJsonBase64,
            sha: sha || undefined
          })
        });

        if (!jsonPutResp.ok) throw new Error("Error al actualizar productos.json");

        showStatus("¡Producto cargado exitosamente! Las TV se actualizarán en breve.");
        document.getElementById("product-form").reset();

      } catch (err) {
        showStatus("Error: " + err.message, true);
      }
    }
  </script>
</body>
</html>
