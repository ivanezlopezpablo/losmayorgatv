<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración Avanzado - Los Mayorga TV</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    .row { display: flex; gap: 15px; }
    .row .form-group { flex: 1; }

    button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #0284c7; color: #fff; width: 100%; padding: 12px; font-size: 16px; }
    .btn-primary:hover { background: #0369a1; }
    .btn-save-order { background: #16a34a; color: #fff; margin-bottom: 15px; }
    .btn-danger { background: #dc2626; color: #fff; }

    /* Lista de Productos y Drag & Drop */
    .product-list { list-style: none; }
    .product-item { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 15px; cursor: grab; }
    .product-item:active { cursor: grabbing; }
    .product-info { display: flex; align-items: center; gap: 15px; flex: 1; }
    .product-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: #0f172a; }
    .product-details h4 { font-size: 16px; color: #fff; }
    .product-details p { font-size: 13px; color: #94a3b8; }

    /* Switch On/Off */
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #64748b; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* Modal emergente de confirmación */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .modal-box { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; border: 1px solid #475569; }
    .modal-box h3 { color: #f8fafc; margin-bottom: 10px; }
    .modal-box p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }

    .hidden { display: none !important; }
    #status { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; }
    .success { background: #15803d; }
    .error { background: #b91c1c; }
  </style>
</head>

              <label>Presentación (ej. PACK POR 6)</label>
              <input type="text" id="prod-pack" placeholder="PACK POR 6 UNIDADES">
            </div>
          </div>
