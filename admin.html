<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - Los Mayorga TV</title>

  <!-- SortableJS para Drag & Drop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #38bdf8; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    .row { display: flex; gap: 15px; }
    .row .form-group { flex: 1; }

    button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #0284c7; color: #fff; width: 100%; padding: 12px; font-size: 16px; }
    .btn-primary:hover { background: #0369a1; }
    .btn-save-order { background: #16a34a; color: #fff; margin-bottom: 15px; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-logout { background: #475569; color: #fff; font-size: 13px; padding: 8px 14px; }

    /* Lista y Drag & Drop */
    .product-list { list-style: none; }
    .product-item { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 15px; cursor: grab; }
    .product-item:active { cursor: grabbing; }
    .product-info { display: flex; align-items: center; gap: 15px; flex: 1; }
    .product-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: #0f172a; }
    .product-details h4 { font-size: 16px; color: #fff; }
    .product-details p { font-size: 13px; color: #94a3b8; }

    /* Switch On/Off */
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #64748b; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* Modales */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .modal-box { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; border: 1px solid #475569; }
    .modal-box h3 { color: #f8fafc; margin-bottom: 10px; }
    .modal-box p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }

    .hidden { display: none !important; }
    #status { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; }
    .success { background: #15803d; color: #fff; }
    .error { background: #b91c1c; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header-bar">
        <h2>Panel de Control Vidriera</h2>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
      </div>

      <!-- CARGAR NUEVA OFERTA -->
      <form id="product-form">
        <div class="form-group">
          <label>Imagen Limpia del Producto</label>
          <input type="file" id="prod-img" accept="image/*" required>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Título (ej. CERVEZA)</label>
            <input type="text" id="prod-title" required placeholder="CERVEZA">
          </div>
          <div class="form-group">
            <label>Subtítulo (ej. CLÁSICA EN LATA)</label>
            <input type="text" id="prod-sub" placeholder="CLÁSICA EN LATA">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Volumen (ej. 473CC)</label>
            <input type="text" id="prod-vol" placeholder="473CC">
          </div>
          <div class="form-group">
            <label>Presentación (ej. PACK POR 6)</label>
            <input type="text" id="prod-pack" placeholder="PACK POR 6 UNIDADES">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Precio Entero (ej. 21.076)</label>
            <input type="text" id="prod-price-int" required placeholder="21.076">
          </div>
          <div class="form-group">
            <label>Precio Decimales</label>
            <input type="text" id="prod-price-dec" value="90">
          </div>
        </div>
        <div class="form-group">
          <label>Programar Publicación (Opcional - Dejar vacío para publicar ya)</label>
          <input type="datetime-local" id="prod-date">
        </div>
        <button type="button" class="btn-primary" onclick="requestUpload()">Publicar Oferta</button>
      </form>
      <div id="status" class="hidden"></div>
    </div>

    <!-- LISTA DE PRODUCTOS Y REORDENAR -->
    <div class="card">
      <h2>Productos en Pantalla</h2>
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">Arrastra las tarjetas para cambiar el orden de reproducción en las Smart TV.</p>
      <button class="btn-save-order" onclick="requestSaveOrder()">Guardar Nuevo Orden</button>
      
      <ul id="product-list" class="product-list"></ul>
    </div>
  </div>

  <!-- MODAL DE CONFIRMACIÓN PASO 1 -->
  <div id="modal-confirm" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="modal-title">¿Estás seguro?</h3>
      <p id="modal-msg">Esta acción actualizará las pantallas de los televisores.</p>
      <div class="modal-actions">
        <button class="btn-primary" style="background:#475569;" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" onclick="confirmStep1()">Continuar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE RECONFIRMACIÓN PASO 2 -->
  <div id="modal-reconfirm" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 style="color:#ef4444;">¡RECONFIRMACIÓN!</h3>
      <p id="modal-reconfirm-msg">¿Confirmas definitivamente aplicar este cambio?</p>
      <div class="modal-actions">
        <button class="btn-primary" style="background:#475569;" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" style="background:#dc2626;" onclick="executeAction()">SÍ, CONFIRMAR CAMBIO</button>
      </div>
    </div>
  </div>

  <script>
    // Verificar autorización de sesión
    if (sessionStorage.getItem("internal_auth_mayorga") !== "true") {
      window.location.href = "login.html";
    }

    function logout() {
      sessionStorage.removeItem("internal_auth_mayorga");
      window.location.href = "login.html";
    }

    const GITHUB_USER = "ivanezlopezpablo";
    const GITHUB_REPO = "losmayorgatv";
    
    // PEGA TU TOKEN EN BASE64 AQUÍ (o el token directo ghp_...)
    const ENCODED_TOKEN = "Z2hwX2VSa2dTZ3RhNXhMMmxRTWN2YWR6TFBPV0Q1U0oyRDNYNEVUMQ==";
    const token = ENCODED_TOKEN.startsWith("ghp_") ? ENCODED_TOKEN : atob(ENCODED_TOKEN);

    let productosList = [];
    let productosSha = "";
    let pendingAction = null;

    const sortableList = document.getElementById('product-list');
    new Sortable(sortableList, { animation: 150 });

    async function loadProductsFromGitHub() {
      try {
        // Fetch directo a la API con t=Date.now() para omitir caché
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/productos.json?t=${Date.now()}`, {
          headers: { 
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });
        
        if (res.ok) {
          const data = await res.json();
          productosSha = data.sha;
          const decoded = decodeURIComponent(escape(atob(data.content)));
          productosList = JSON.parse(decoded);
          renderProductList();
        } else {
          console.error("Error al obtener productos.json:", res.status);
        }
      } catch (err) {
        console.error("Error de conexión:", err);
      }
    }

    function renderProductList() {
      sortableList.innerHTML = "";
      productosList.forEach((p, index) => {
        const li = document.createElement("li");
        li.className = "product-item";
        li.dataset.id = p.id || index;

        const imgUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/imagenes/${p.imagen}?t=${Date.now()}`;

        li.innerHTML = `
          <div class="product-info">
            <img src="${imgUrl}" class="product-thumb">
            <div class="product-details">
              <h4>${p.titulo} - $${p.precioEntero}</h4>
              <p>${p.subtitulo || ''} ${p.fechaProgramada ? '| 🕒 Prog: ' + p.fechaProgramada.replace('T', ' ') : ''}</p>
            </div>
          </div>
          
          <label class="switch" title="Activar/Desactivar">
            <input type="checkbox" ${p.activo !== false ? 'checked' : ''} onchange="requestToggleActive(${p.id || index}, this.checked)">
            <span class="slider"></span>
          </label>

          <button class="btn-danger" onclick="requestDelete(${p.id || index})">Eliminar</button>
        `;
        sortableList.appendChild(li);
      });
    }

    function showStatus(msg, isError = false) {
      const statusDiv = document.getElementById("status");
      statusDiv.textContent = msg;
      statusDiv.className = isError ? "error" : "success";
      statusDiv.classList.remove("hidden");
    }

    function openModal(title, msg, actionFn) {
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-msg").textContent = msg;
      pendingAction = actionFn;
      document.getElementById("modal-confirm").classList.remove("hidden");
    }

    function confirmStep1() {
      document.getElementById("modal-confirm").classList.add("hidden");
      document.getElementById("modal-reconfirm").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal-confirm").classList.add("hidden");
      document.getElementById("modal-reconfirm").classList.add("hidden");
      pendingAction = null;
      loadProductsFromGitHub();
    }

    async function executeAction() {
      document.getElementById("modal-reconfirm").classList.add("hidden");
      if (pendingAction) await pendingAction();
    }

    function requestUpload() {
      if (!document.getElementById("prod-img").files[0]) return alert("Selecciona una imagen");
      openModal("¿Publicar Producto?", "La oferta se subirá a GitHub y estará disponible en las pantallas.", processUpload);
    }

    function requestSaveOrder() {
      openModal("¿Guardar Nuevo Orden?", "El orden de reproducción cambiará en todas las Smart TV.", processSaveOrder);
    }

    function requestToggleActive(id, newState) {
      const stateText = newState ? "ACTIVAR" : "DESACTIVAR";
      openModal(`¿${stateText} Producto?`, `El producto ${newState ? 'volverá a mostrarse' : 'se ocultará'} en la TV.`, () => {
        const prod = productosList.find((p, idx) => (p.id || idx) == id);
        if (prod) prod.activo = newState;
        return saveJsonToGitHub("Cambiar estado activo/inactivo");
      });
    }

    function requestDelete(id) {
      openModal("¿ELIMINAR PRODUCTO?", "Esta acción es irreversible y quitará el producto del sistema.", () => {
        productosList = productosList.filter((p, idx) => (p.id || idx) != id);
        return saveJsonToGitHub("Eliminar producto");
      });
    }

    async function processSaveOrder() {
      const newOrderIds = Array.from(sortableList.children).map(li => li.dataset.id);
      productosList.sort((a, b) => newOrderIds.indexOf(String(a.id || productosList.indexOf(a))) - newOrderIds.indexOf(String(b.id || productosList.indexOf(b))));
      await saveJsonToGitHub("Reordenar lista de productos");
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = err => reject(err);
    });

    async function processUpload() {
      showStatus("Subiendo oferta...");
      try {
        const file = document.getElementById("prod-img").files[0];
        const base64Content = await toBase64(file);
        const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
        const imgFileName = `${Date.now()}_${cleanName}`;

        // 1. Subir Imagen
        const imgRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/imagenes/${imgFileName}`, {
          method: "PUT",
          headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: `Subir imagen ${imgFileName}`, content: base64Content })
        });

        if (!imgRes.ok) throw new Error("Error al subir la imagen");

        // 2. Crear objeto de producto
        const newProd = {
          id: Date.now(),
          activo: true,
          fechaProgramada: document.getElementById("prod-date").value || null,
          imagen: imgFileName,
          titulo: document.getElementById("prod-title").value.toUpperCase(),
          subtitulo: document.getElementById("prod-sub").value.toUpperCase(),
          volumen: document.getElementById("prod-vol").value.toUpperCase(),
          presentacion: document.getElementById("prod-pack").value.toUpperCase(),
          precioEntero: document.getElementById("prod-price-int").value,
          precioDecimal: document.getElementById("prod-price-dec").value
        };

        productosList.push(newProd);
        await saveJsonToGitHub("Añadir nuevo producto");
        document.getElementById("product-form").reset();
        showStatus("¡Oferta publicada exitosamente!");
      } catch (err) {
        showStatus("Error: " + err.message, true);
      }
    }

    async function saveJsonToGitHub(commitMsg) {
      showStatus("Guardando cambios en GitHub...");
      try {
        const updatedJsonBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(productosList, null, 2))));

        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/productos.json`, {
          method: "PUT",
          headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: commitMsg, content: updatedJsonBase64, sha: productosSha })
        });

        if (res.ok) {
          showStatus("¡Cambios guardados con éxito!");
          // Re-cargar inmediatamente desde la API
          setTimeout(loadProductsFromGitHub, 1000);
        } else {
          throw new Error("Error actualizando productos.json");
        }
      } catch (err) {
        showStatus("Error: " + err.message, true);
      }
    }

    // Cargar productos al abrir
    loadProductsFromGitHub();
  </script>
</body>
</html>
